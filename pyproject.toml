[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volatility-targeted-momentum"
version = "0.1.0"
description = "Reusable calculations for the Risk-Controlled Momentum research project"
requires-python = ">=3.12"
dependencies = ["pandas"]

[tool.setuptools.packages.find]
include = ["volatility_targeted_momentum*"]
